name: prune-branches

# Deletes the claude/* branches Claude Code pushes once their pull request has
# merged. Cloud sessions can push a branch but not delete one, so without this
# every merged pull request leaves its branch behind. Squash merges leave no
# ancestry to test, so a branch counts as merged only while its tip is still
# the head of a merged pull request from this repository: a branch with later
# commits, or one an open pull request uses, is kept. A deleted branch can be
# restored from its pull request page.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: prune-branches
  cancel-in-progress: false

jobs:
  prune:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Delete merged claude/* branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo=$GITHUB_REPOSITORY
          # Read everything first, so a failed call stops the job instead of
          # looking like an empty list (an empty open list would drop a guard).
          heads=$(git ls-remote --heads origin)
          open=$(gh api --paginate "repos/$repo/pulls?state=open&per_page=100" --jq '.[].head.ref')
          merged=$(gh api --paginate "repos/$repo/pulls?state=closed&per_page=100" \
            --jq '.[] | select(.merged_at != null) | [.number, (.head.repo.full_name // "-"), .head.ref, .head.sha] | @tsv')

          declare -A tip=() del=()
          while read -r sha ref; do
            if [ -n "$ref" ]; then tip[${ref#refs/heads/}]=$sha; fi
          done <<<"$heads"

          while IFS=$'\t' read -r num from ref sha; do
            [ "$from" = "$repo" ] || continue
            [[ $ref =~ ^claude/[A-Za-z0-9._/-]+$ ]] || continue
            [ "${tip[$ref]:-}" = "$sha" ] || continue
            if grep -qxF -- "$ref" <<<"$open"; then
              echo "kept $ref: an open pull request uses it"
              continue
            fi
            del[$ref]=$sha
            echo "deleting $ref at $sha (merged in #$num)"
          done <<<"$merged"

          if [ ${#del[@]} -eq 0 ]; then
            echo "nothing to prune"
            exit 0
          fi
          # The lease makes each delete conditional on the branch still being
          # at the merged head, checked by GitHub at push time.
          leases=() specs=()
          for ref in "${!del[@]}"; do
            leases+=("--force-with-lease=refs/heads/$ref:${del[$ref]}")
            specs+=(":refs/heads/$ref")
          done
          git push "${leases[@]}" origin "${specs[@]}"
