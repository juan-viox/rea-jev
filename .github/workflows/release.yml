name: release

# Creates the v<version> tag when a push to main changes the version in
# package.json, so the CHANGELOG links resolve without anyone tagging by hand
# (Claude Code cloud sessions cannot push tags). The tag goes on the pushed
# commit, which is main's tip.

on:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create the tag
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          version() {
            git show "$1:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version'
          }
          tag="v$(version "$GITHUB_SHA")"
          sha=$GITHUB_SHA
          if git cat-file -e "$BEFORE^{commit}" 2>/dev/null && [ "v$(version "$BEFORE")" = "$tag" ]; then
            echo "version unchanged at $tag; nothing to tag"
            exit 0
          fi
          if ! [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::package.json version is not <major>.<minor>.<patch>"
            exit 1
          fi
          if have=$(git rev-parse -q --verify "refs/tags/$tag^{commit}"); then
            if [ "$have" = "$sha" ]; then
              echo "$tag already points at $sha"
              exit 0
            fi
            echo "::error::$tag already exists at $have"
            exit 1
          fi
          git push origin "$sha:refs/tags/$tag"
          echo "tagged $sha as $tag"
